[project]
name = "aegis-ml"
version = "0.1.0"
description = "Aegis M3 — ML training corpus assembly and (future) model training. Not imported by the runtime backend."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "requests>=2.32",
    "joblib>=1.4",
    # Not used directly by aegis_ml — needed only because aegis_ml/features.py imports the
    # real backend parsing/indicator code (app.parsing.eml_parser, app.indicators.engine) by
    # path, for train/serve feature parity. Pinned loosely to whatever the backend itself
    # requires; see backend/pyproject.toml.
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Only used by aegis_ml.synthesize (bounded synthetic data generation, run explicitly via
    # `python -m aegis_ml.cli synthesize`, never part of the normal download/build step).
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aegis_ml*"]

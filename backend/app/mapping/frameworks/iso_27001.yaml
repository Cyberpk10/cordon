version: "1.10"
framework: "ISO/IEC 27001:2022 Annex A"
framework_key: iso_27001
source: "https://www.iso.org/standard/27001"
controls:
  - id: A.5.7
    name: "Threat intelligence"
    url: null
  - id: A.6.3
    name: "Information security awareness, education and training"
    url: null
  - id: A.8.7
    name: "Protection against malware"
    url: null
  - id: A.8.23
    name: "Web filtering"
    url: null
  - id: A.5.14
    name: "Information transfer"
    url: null
  # M5 Stage 1 — intrusion & data-exfiltration detection (access control + logging, per
  # your spec).
  - id: A.5.15
    name: "Access control"
    url: null
  - id: A.8.2
    name: "Privileged access rights"
    url: null
  - id: A.8.15
    name: "Logging"
    url: null
  - id: A.8.16
    name: "Monitoring activities"
    url: null
  # M6 Stage 1 — autonomous response (graduated autonomy). Verified via isms.online.
  - id: A.5.26
    name: "Response to information security incidents"
    url: null

mappings:
  SENDER_REPLYTO_MISMATCH: [A.5.7, A.5.14]
  DISPLAY_NAME_EMAIL_MISMATCH: [A.5.7, A.5.14]
  LOOKALIKE_DOMAIN: [A.5.7, A.8.23]
  PUNYCODE_IDN_DOMAIN: [A.5.7, A.8.23]
  URGENCY_LANGUAGE: [A.6.3]
  CREDENTIAL_REQUEST: [A.6.3, A.5.7]
  PAYMENT_REQUEST: [A.6.3, A.5.7]
  LINK_DISPLAY_HREF_MISMATCH: [A.8.23]
  LINK_SHORTENER: [A.8.23]
  LINK_SUSPICIOUS_TLD: [A.8.23, A.5.7]
  LINK_IP_LITERAL: [A.8.23]
  ATTACHMENT_RISKY_EXTENSION: [A.8.7]
  ATTACHMENT_DOUBLE_EXTENSION: [A.8.7]
  ATTACHMENT_MACRO_ENABLED: [A.8.7]
  AUTH_SPF_FAIL: [A.5.7, A.5.14]
  AUTH_DKIM_FAIL: [A.5.7, A.5.14]
  AUTH_DMARC_FAIL: [A.5.7, A.5.14]

  # M5 Stage 1 — intrusion & data-exfiltration detection.
  BRUTE_FORCE_PASSWORD_SPRAY: [A.5.15, A.8.16, A.8.15]
  IMPOSSIBLE_TRAVEL: [A.5.15, A.8.16, A.8.15]
  OFF_HOURS_ACCESS: [A.5.15, A.8.16, A.8.15]
  MASS_FILE_ACCESS: [A.8.16, A.8.15]
  DATA_EXFIL_LARGE_TRANSFER: [A.8.16, A.8.15]
  DATA_EXFIL_LARGE_DB_EXPORT: [A.8.16, A.8.15]
  PRIVILEGE_ESCALATION: [A.5.15, A.8.2, A.8.15]

  # M5 Stage 2 — behavioral baselines (UEBA). Reuses IMPOSSIBLE_TRAVEL's control set.
  ANOMALOUS_LOCATION: [A.5.15, A.8.16, A.8.15]

  # Stage 1 detection hardening — cross-actor correlation + cumulative exfiltration.
  CROSS_ACTOR_PASSWORD_SPRAY: [A.5.15, A.8.16, A.8.15]
  COORDINATED_ATTACK_CORRELATION: [A.5.15, A.8.16]
  CUMULATIVE_EXFIL_VOLUME: [A.8.16, A.8.15]

  # Stage 3a detection hardening — per-account sender-history-aware phishing detection.
  FIRST_CONTACT_SENDER: [A.5.7]
  UNKNOWN_VENDOR_CLAIM: [A.6.3, A.5.7]
  LOOKALIKE_OF_KNOWN_SENDER: [A.5.7, A.8.23]
  DOMAIN_LOOKS_RANDOMLY_GENERATED: [A.5.7, A.8.23]

  # Detection max-out Stage A — trusted-sender content anomaly.
  TRUSTED_SENDER_ANOMALY: [A.6.3, A.5.7]

  # Detection max-out Stage B — behavioral baselines with anti-poisoning.
  SENSITIVE_RESOURCE_FIRST_ACCESS: [A.5.15, A.8.16]
  BASELINE_RAMP_ANOMALY: [A.5.15, A.8.16]

  # Detection max-out Stage D — long-dwell/low-signal correlation. Reuses the same
  # controls as BASELINE_RAMP_ANOMALY above (a trend/pattern detected across many days
  # of history via an already-trusted account, not a single event).
  LOW_SIGNAL_PATTERN_ACCUMULATION: [A.5.15, A.8.16]

  # Early-warning sensor Stage 2 — corroborated precursor-signal alerts ("attack
  # forming"), distinct from any single finding. Reuses existing controls only.
  EARLY_WARNING_ATTACK_FORMING: [A.5.7, A.8.16]

  # Threat-intelligence enrichment Stage 1 — multi-feed hostname/URL/IP
  # cross-reference (app.threat_intel). See app/threat_intel/data/sources.md.
  LINK_KNOWN_MALICIOUS: [A.8.23]
  SENDER_DOMAIN_KNOWN_BAD: [A.8.23]
  SENDER_IP_KNOWN_MALICIOUS: [A.8.16]
  EVENT_IP_KNOWN_MALICIOUS: [A.8.16]

  # M6 Stage 1 — autonomous response (graduated autonomy). Response/containment actions.
  QUARANTINE_EMAIL: [A.5.26]
  DISABLE_SESSION: [A.5.26, A.8.2]
  BLOCK_SENDER_DOMAIN: [A.5.26]
  FLAG_ACCOUNT_FOR_REVIEW: [A.5.26]

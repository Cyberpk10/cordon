version: "1.9"
framework: "MITRE ATT&CK"
framework_key: mitre_attack
source: "https://attack.mitre.org"
controls:
  - id: T1566
    name: "Phishing"
    url: "https://attack.mitre.org/techniques/T1566/"
  - id: T1566.001
    name: "Phishing: Spearphishing Attachment"
    url: "https://attack.mitre.org/techniques/T1566/001/"
  - id: T1566.002
    name: "Phishing: Spearphishing Link"
    url: "https://attack.mitre.org/techniques/T1566/002/"
  - id: T1598
    name: "Phishing for Information"
    url: "https://attack.mitre.org/techniques/T1598/"
  - id: T1583.001
    name: "Acquire Infrastructure: Domains"
    url: "https://attack.mitre.org/techniques/T1583/001/"
  - id: T1656
    name: "Impersonation"
    url: "https://attack.mitre.org/techniques/T1656/"
  - id: T1204.002
    name: "User Execution: Malicious File"
    url: "https://attack.mitre.org/techniques/T1204/002/"
  # Threat-intelligence enrichment Stage 1. T1204.001 (not .002, which is about malicious
  # FILES) is the precise sub-technique for a malicious LINK. T1071 covers the IP-based
  # checks — C2/application-layer-protocol communication is the closest real attacker
  # behavior a known-malicious-IP match corroborates.
  - id: T1204.001
    name: "User Execution: Malicious Link"
    url: "https://attack.mitre.org/techniques/T1204/001/"
  - id: T1071
    name: "Application Layer Protocol"
    url: "https://attack.mitre.org/techniques/T1071/"
  # M5 Stage 1 — intrusion & data-exfiltration detection (activity-event telemetry).
  - id: T1110
    name: "Brute Force"
    url: "https://attack.mitre.org/techniques/T1110/"
  - id: T1110.003
    name: "Brute Force: Password Spraying"
    url: "https://attack.mitre.org/techniques/T1110/003/"
  - id: T1078
    name: "Valid Accounts"
    url: "https://attack.mitre.org/techniques/T1078/"
  - id: T1048
    name: "Exfiltration Over Alternative Protocol"
    url: "https://attack.mitre.org/techniques/T1048/"
  - id: T1567
    name: "Exfiltration Over Web Service"
    url: "https://attack.mitre.org/techniques/T1567/"
  - id: T1068
    name: "Exploitation for Privilege Escalation"
    url: "https://attack.mitre.org/techniques/T1068/"
  # Stage 1 detection hardening — cross-actor correlation + cumulative exfiltration.
  - id: T1030
    name: "Data Transfer Size Limits"
    url: "https://attack.mitre.org/techniques/T1030/"
  # Detection max-out Stage A — trusted-sender content anomaly.
  - id: T1586.002
    name: "Compromise Accounts: Email Accounts"
    url: "https://attack.mitre.org/techniques/T1586/002/"
  # Detection max-out Stage B — behavioral baselines with anti-poisoning.
  - id: T1213
    name: "Data from Information Repositories"
    url: "https://attack.mitre.org/techniques/T1213/"

mappings:
  SENDER_REPLYTO_MISMATCH: [T1656]
  DISPLAY_NAME_EMAIL_MISMATCH: [T1656]
  LOOKALIKE_DOMAIN: [T1583.001, T1656, T1566.002]
  PUNYCODE_IDN_DOMAIN: [T1583.001, T1566.002]
  URGENCY_LANGUAGE: [T1598]
  CREDENTIAL_REQUEST: [T1598, T1566.002]
  PAYMENT_REQUEST: [T1598]
  LINK_DISPLAY_HREF_MISMATCH: [T1566.002]
  LINK_SHORTENER: [T1566.002]
  LINK_SUSPICIOUS_TLD: [T1566.002, T1583.001]
  LINK_IP_LITERAL: [T1566.002]
  ATTACHMENT_RISKY_EXTENSION: [T1566.001, T1204.002]
  ATTACHMENT_DOUBLE_EXTENSION: [T1566.001, T1204.002]
  ATTACHMENT_MACRO_ENABLED: [T1566.001, T1204.002]
  AUTH_SPF_FAIL: [T1656]
  AUTH_DKIM_FAIL: [T1656]
  AUTH_DMARC_FAIL: [T1656]
  # AI_AUTHORED_SUSPECTED is a stylometric/authorship heuristic (see
  # backend/app/indicators/ai_authored.py), not a literal MITRE technique match — there is
  # no dedicated ATT&CK technique for "the lure text was LLM-generated." It's mapped to the
  # T1566 phishing family because AI-generated fluent text is primarily used to scale and
  # polish spearphishing/phishing lures (T1566, T1566.002), which is the attacker behavior
  # this signal is corroborating evidence for.
  AI_AUTHORED_SUSPECTED: [T1566, T1566.002]

  # M5 Stage 1 — intrusion & data-exfiltration detection.
  BRUTE_FORCE_PASSWORD_SPRAY: [T1110, T1110.003]
  IMPOSSIBLE_TRAVEL: [T1078]
  OFF_HOURS_ACCESS: [T1078]
  MASS_FILE_ACCESS: [T1048]
  DATA_EXFIL_LARGE_TRANSFER: [T1048, T1567]
  DATA_EXFIL_LARGE_DB_EXPORT: [T1048]
  PRIVILEGE_ESCALATION: [T1068, T1078]

  # M5 Stage 2 — behavioral baselines (UEBA). Reuses IMPOSSIBLE_TRAVEL's control set —
  # same underlying technique (anomalous authentication/access location).
  ANOMALOUS_LOCATION: [T1078]

  # Stage 1 detection hardening — cross-actor correlation + cumulative exfiltration.
  CROSS_ACTOR_PASSWORD_SPRAY: [T1110, T1110.003]
  COORDINATED_ATTACK_CORRELATION: [T1078]
  CUMULATIVE_EXFIL_VOLUME: [T1030, T1048, T1567]

  # Stage 3a detection hardening — per-account sender-history-aware phishing detection.
  FIRST_CONTACT_SENDER: [T1566]
  # No exact ATT&CK technique for "claims a relationship that doesn't exist" as a standalone
  # concept (same precedent as AI_AUTHORED_SUSPECTED above) — mapped to the phishing family
  # this framing is used to scale, plus Phishing for Information since a false vendor-claim
  # is frequently the setup for a follow-on information/credential request.
  UNKNOWN_VENDOR_CLAIM: [T1566, T1598]
  LOOKALIKE_OF_KNOWN_SENDER: [T1583.001, T1656, T1566.002]
  DOMAIN_LOOKS_RANDOMLY_GENERATED: [T1583.001, T1566.002]

  # Detection max-out Stage A — trusted-sender content anomaly. T1586.002 is the precise fit
  # for this indicator's actual thesis: a legitimately-trusted account being abused, not an
  # attacker-controlled lookalike.
  TRUSTED_SENDER_ANOMALY: [T1586.002, T1566.002, T1598]

  # Detection max-out Stage B — behavioral baselines with anti-poisoning. No dedicated
  # ATT&CK technique exists for "gradual baseline evasion" itself (same precedent as
  # AI_AUTHORED_SUSPECTED/UNKNOWN_VENDOR_CLAIM above) — mapped to the closest real attacker
  # behavior: collecting data from internal repositories via a valid, already-trusted account.
  SENSITIVE_RESOURCE_FIRST_ACCESS: [T1213, T1078]
  BASELINE_RAMP_ANOMALY: [T1213, T1078]

  # Detection max-out Stage D — long-dwell/low-signal correlation. Reuses the same
  # controls as BASELINE_RAMP_ANOMALY above (a trend/pattern detected across many days
  # of history via an already-trusted account, not a single event).
  LOW_SIGNAL_PATTERN_ACCUMULATION: [T1213, T1078]

  # Early-warning sensor Stage 2 — corroborated precursor-signal alerts ("attack
  # forming"), distinct from any single finding. Reuses existing controls only.
  EARLY_WARNING_ATTACK_FORMING: [T1566, T1078]

  # Threat-intelligence enrichment Stage 1 — multi-feed hostname/URL/IP cross-reference
  # (app.threat_intel). See app/threat_intel/data/sources.md for feed provenance/licenses.
  LINK_KNOWN_MALICIOUS: [T1204.001, T1583.001]
  SENDER_DOMAIN_KNOWN_BAD: [T1583.001]
  SENDER_IP_KNOWN_MALICIOUS: [T1071]
  EVENT_IP_KNOWN_MALICIOUS: [T1071]

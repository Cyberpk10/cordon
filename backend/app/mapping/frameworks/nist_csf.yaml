version: "1.4"
framework: "NIST Cybersecurity Framework 2.0"
framework_key: nist_csf
source: "https://www.nist.gov/cyberframework"
controls:
  - id: ID.RA-05
    name: "Threats, vulnerabilities, likelihoods, and impacts are used to determine risk"
    url: "https://csrc.nist.gov/pubs/csswp/29/the-nist-cybersecurity-framework-20/final"
  - id: PR.AT-01
    name: "Personnel are provided awareness and training on phishing and social engineering"
    url: "https://csrc.nist.gov/pubs/csswp/29/the-nist-cybersecurity-framework-20/final"
  - id: DE.CM-01
    name: "Networks and network services are monitored to find potentially adverse events"
    url: "https://csrc.nist.gov/pubs/csswp/29/the-nist-cybersecurity-framework-20/final"
  - id: DE.AE-02
    name: "Detected events are analyzed to understand attack targets and methods"
    url: "https://csrc.nist.gov/pubs/csswp/29/the-nist-cybersecurity-framework-20/final"
  # M5 Stage 1 — intrusion & data-exfiltration detection. Your spec named the CSF 1.1
  # category "PR.AC" (Access Control); CSF 2.0 renamed that category to "PR.AA" (Identity
  # Management, Authentication, and Access Control) — PR.AA-03/05 below are the current
  # subcategories in that renamed family, verified against NIST's published CSF 2.0
  # subcategory text (csf.tools, cross-referencing NIST CSWP 29) rather than using the
  # withdrawn "PR.AC-*" ids.
  - id: DE.CM-03
    name: "Personnel activity and technology usage are monitored to find potentially adverse events"
    url: "https://csrc.nist.gov/pubs/csswp/29/the-nist-cybersecurity-framework-20/final"
  - id: DE.AE-03
    name: "Information is correlated from multiple sources"
    url: "https://csrc.nist.gov/pubs/csswp/29/the-nist-cybersecurity-framework-20/final"
  - id: DE.AE-08
    name: "Incidents are declared when adverse events meet the defined incident criteria"
    url: "https://csrc.nist.gov/pubs/csswp/29/the-nist-cybersecurity-framework-20/final"
  - id: PR.AA-03
    name: "Users, services, and hardware are authenticated"
    url: "https://csrc.nist.gov/pubs/csswp/29/the-nist-cybersecurity-framework-20/final"
  - id: PR.AA-05
    name: "Access permissions, entitlements, and authorizations are defined in a policy, managed, enforced, and reviewed, and incorporate the principles of least privilege and separation of duties"
    url: "https://csrc.nist.gov/pubs/csswp/29/the-nist-cybersecurity-framework-20/final"
  # M6 Stage 1 — autonomous response (graduated autonomy). Verified via csf.tools,
  # cross-referencing NIST CSWP 29.
  - id: RS.MI-01
    name: "Incidents are contained"
    url: "https://csrc.nist.gov/pubs/csswp/29/the-nist-cybersecurity-framework-20/final"

mappings:
  SENDER_REPLYTO_MISMATCH: [DE.AE-02, PR.AT-01]
  DISPLAY_NAME_EMAIL_MISMATCH: [DE.AE-02, PR.AT-01]
  LOOKALIKE_DOMAIN: [ID.RA-05, DE.AE-02]
  PUNYCODE_IDN_DOMAIN: [ID.RA-05, DE.AE-02]
  URGENCY_LANGUAGE: [PR.AT-01]
  CREDENTIAL_REQUEST: [PR.AT-01, DE.AE-02]
  PAYMENT_REQUEST: [PR.AT-01, DE.AE-02]
  LINK_DISPLAY_HREF_MISMATCH: [DE.CM-01, DE.AE-02]
  LINK_SHORTENER: [DE.CM-01]
  LINK_SUSPICIOUS_TLD: [DE.CM-01, ID.RA-05]
  LINK_IP_LITERAL: [DE.CM-01]
  ATTACHMENT_RISKY_EXTENSION: [DE.CM-01, ID.RA-05]
  ATTACHMENT_DOUBLE_EXTENSION: [DE.CM-01, ID.RA-05]
  ATTACHMENT_MACRO_ENABLED: [DE.CM-01, ID.RA-05]
  AUTH_SPF_FAIL: [ID.RA-05, DE.AE-02]
  AUTH_DKIM_FAIL: [ID.RA-05, DE.AE-02]
  AUTH_DMARC_FAIL: [ID.RA-05, DE.AE-02]

  # M5 Stage 1 — intrusion & data-exfiltration detection.
  BRUTE_FORCE_PASSWORD_SPRAY: [DE.CM-03, PR.AA-03, DE.AE-08]
  IMPOSSIBLE_TRAVEL: [DE.AE-03, PR.AA-03, DE.AE-08]
  OFF_HOURS_ACCESS: [DE.CM-03, DE.AE-08]
  MASS_FILE_ACCESS: [DE.CM-03, DE.AE-08]
  DATA_EXFIL_LARGE_TRANSFER: [DE.CM-01, DE.AE-08]
  DATA_EXFIL_LARGE_DB_EXPORT: [DE.CM-01, DE.AE-08]
  PRIVILEGE_ESCALATION: [DE.AE-03, PR.AA-05, DE.AE-08]

  # M5 Stage 2 — behavioral baselines (UEBA). Reuses IMPOSSIBLE_TRAVEL's control set.
  ANOMALOUS_LOCATION: [DE.AE-03, PR.AA-03, DE.AE-08]

  # Stage 1 detection hardening — cross-actor correlation + cumulative exfiltration.
  # DE.AE-03 ("information is correlated from multiple sources") is a near-literal match
  # for both cross-actor detections.
  CROSS_ACTOR_PASSWORD_SPRAY: [DE.CM-03, PR.AA-03, DE.AE-08, DE.AE-03]
  COORDINATED_ATTACK_CORRELATION: [DE.AE-03, DE.AE-08]
  CUMULATIVE_EXFIL_VOLUME: [DE.CM-01, DE.AE-08]

  # M6 Stage 1 — autonomous response (graduated autonomy). Response/containment actions,
  # not detections — mapped by action type, same map_indicators mechanism.
  QUARANTINE_EMAIL: [RS.MI-01]
  DISABLE_SESSION: [RS.MI-01, PR.AA-05]
  BLOCK_SENDER_DOMAIN: [RS.MI-01]
  FLAG_ACCOUNT_FOR_REVIEW: [RS.MI-01, PR.AA-05]
